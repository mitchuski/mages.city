# deploy/vti/core-node/systemd/wait-for-dids.conf — drop-in for vti-mediator, vti-vta, vti-vtc.
# On a cold boot these three resolve their own did:webvh through https://dids.mages.city, which only answers once
# vti-dids AND the tunnel are up; without this the mediator exits ("DID host answered 502") and the VTC starts its
# messaging degraded. Waits up to 120 s, never fails the unit (the leading '-').
#   for u in vti-mediator vti-vta vti-vtc; do sudo install -D -m 644 wait-for-dids.conf /etc/systemd/system/$u.service.d/wait-for-dids.conf; done
#   sudo systemctl daemon-reload
[Unit]
After=cloudflared.service vti-dids.service
Wants=cloudflared.service

[Service]
TimeoutStartSec=180
ExecStartPre=-/bin/sh -c 'for i in $(seq 60); do curl -sf -o /dev/null --max-time 3 https://dids.mages.city/ && exit 0; sleep 2; done; echo "dids.mages.city not answering after 120 s; starting anyway"'
