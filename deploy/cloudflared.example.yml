# deploy/cloudflared.example.yml — the tunnel's ingress for mages.city.
# Copy to /etc/cloudflared/config.yml on the always-on host; fill the tunnel id.
# Rules are evaluated top to bottom; the first match wins. The apex (mages.city) is NOT here —
# it is a Workers custom domain (the front). The wildcard DNS record *.mages.city points at
# this tunnel, so every other hostname lands below.
#
# VTI ports are placeholders: take the real ones from vti-setup / the services' config.

tunnel: <TUNNEL-ID>
credentials-file: /etc/cloudflared/<TUNNEL-ID>.json

ingress:
  # the Portal desk — JSON doors path-routed to portal/server.js; every other path on
  # portal.mages.city is the Portal's wiki pages (served by the farm below)
  - hostname: portal.mages.city
    path: ^/(say|open|topics|thread/.*|recent|ledger|head|hide|pin)$
    service: http://127.0.0.1:4445

  # the Exchange desk — same shape: JSON doors to exchange/desk.js, pages from the farm.
  # (Added 2026-09-07 with mages-exchange.service; the desk was running with no route.)
  - hostname: exchange.mages.city
    path: ^/(offer|request|grant|adopt|attest|catalog|standing|graph|recent)$
    service: http://127.0.0.1:4448

  # The VTI stack is NOT in this tunnel (ruled 2026-09-07).
  #
  #   vta.mages.city · vtc.mages.city · mediator.mages.city · dids.mages.city
  #
  # are CNAMEs to the hosted VTA Farm's load balancer, DNS-only (grey cloud), created in the
  # Cloudflare dashboard. They must NOT appear here: a hostname is answered by whatever its DNS
  # points at, and these point at the farm. Leaving stale rules below would only mislead.
  #
  # Note `dids.` (plural) — upstream's own name, and the farm's. Earlier drafts here said `did.`.
  #
  # If the City ever self-hosts the stack, the rules come back with the upstream ports:
  #   vta 8100 · vtc 8200 · mediator 7037 · dids 8534
  # but see docs/VTAFARM.md: the City is a community operator, not a farm operator.

  # the gate service (Phase 2)
  - hostname: gate.mages.city
    service: http://127.0.0.1:4446

  # everything else under *.mages.city is the wiki farm:
  # wiki. (the Hall) · swarm. (district) · portal. (pages) · <name>. (residents)
  - hostname: "*.mages.city"
    service: http://127.0.0.1:3333

  - service: http_status:404
